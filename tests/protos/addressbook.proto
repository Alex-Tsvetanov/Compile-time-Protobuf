// Sample proto used by tests. Classic "address book" — minimal but exercises
// scalar fields, repeated fields, nested messages, and an enum.

syntax = "proto3";

package tutorial;

message Person {
  string name = 1;
  int32 id = 2;
  string email = 3;

  enum PhoneType {
    MOBILE = 0;
    HOME = 1;
    WORK = 2;
  }

  message PhoneNumber {
    string number = 1;
    PhoneType type = 2;
  }

  repeated PhoneNumber phones = 4;
  bytes avatar = 5;
  repeated int32 lucky_numbers = 6;

  // Fixed-width scalars: their wire form is raw little-endian bytes, not a
  // varint, and nothing here used to exercise that.
  fixed32 checksum = 7;
  sfixed64 offset = 8;
  repeated sfixed32 deltas = 9;
}

message AddressBook {
  repeated Person people = 1;
}
